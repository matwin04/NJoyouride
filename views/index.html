<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>NJoy Your Ride</title>

    <meta property="description" content="Dynamic Transit Maps that make transit more accessible and enjoyable for all" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="N-Joy Your Ride" />
    <meta property="og:url" content="https://ride.mattwiner.org/" />
    <meta property="og:image" content="https://ride.mattwiner.org/public/icons/favicon.svg" />
    <meta property="og:description" content="Making transit more accessible and enjoyable for all" />

    <link rel="icon" type="image/x-icon" href="/public/icons/favicon.svg" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@100..900&display=swap" />
    <link rel="stylesheet" href="/public/styles/main.css" />
</head>

<body>
<!-- NAVBAR -->
<div class="navbar">
    <div class="nav-title">Transit Map</div>

    <label for="map-select">Map Select</label>
    <select id="map-select"></select>

    <button id="theme-toggle" class="theme-btn">
        <span class="mdi mdi-weather-night"></span>
    </button>
</div>

<div id="app">
    <!-- SIDE PANEL -->
    <div class="col" id="side-panel">
        <!-- STOP CARD -->
        <div class="card">
            <div class="card-header">
                <h1 id="stopName">Departures</h1>
                <span class="stop-label" id="stopLabel"></span>
            </div>
        </div>

        <!-- DEPARTURE CARDS -->
        <div id="list">
            <div class="state-message">Select a station</div>
        </div>
        <div id="resize-handle"></div>
    </div>

    <!-- MAP -->
    <div class="col" id="svg-container"></div>
</div>

<!-- SCRIPT -->
<script type="module" src="/public/scripts/metro.js"></script>

<script>
    window.va =
        window.va ||
        function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
